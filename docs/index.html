<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>tile-math demo: zoom 6 tiles over five European capitals</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <style>
    body { margin: 0; font-family: sans-serif; }
    header { padding: 8px 12px; }
    h1 { font-size: 1.2rem; margin: 0 0 4px; }
    p { margin: 0; font-size: 0.9rem; }
    #map { height: calc(100vh - 80px); }
  </style>
</head>
<body>
  <header>
    <h1>tile-math demo</h1>
    <p>The 12 zoom-6 XYZ tiles covering the bounding box of London, Paris, Brussels, Amsterdam and Berlin, as
      produced by <code>tile-math bbox</code>. Click a tile for its z/x/y and quadkey.
      <a href="https://github.com/AmmarYasser455/tile-math">Source repository</a></p>
  </header>
  <div id="map"></div>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    var map = L.map('map').setView([50, 6], 5);
    L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
    }).addTo(map);
    fetch('demo.geojson').then(function (r) { return r.json(); }).then(function (data) {
      L.geoJSON(data, {
        style: { color: '#c2410c', weight: 2, fillOpacity: 0.1 },
        onEachFeature: function (f, layer) {
          var p = f.properties;
          layer.bindPopup(p.z + '/' + p.x + '/' + p.y + '<br>quadkey ' + p.quadkey);
        }
      }).addTo(map);
    });
  </script>
</body>
</html>
