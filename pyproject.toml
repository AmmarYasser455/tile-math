[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "tile-math"
version = "0.1.0"
description = "Convert between lat/lon, XYZ web-map tiles and quadkeys, and list tiles covering a bounding box."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = ["pyproj>=3.3"]

[project.optional-dependencies]
test = ["pytest"]

[project.scripts]
tile-math = "tile_math.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
